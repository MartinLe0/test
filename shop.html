<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | VOID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-white font-['Inter']">
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-['Oswald'] tracking-tighter italic">VOID_</a>
            <div class="hidden md:flex space-x-8 uppercase text-xs tracking-widest">
                <a href="index.html" class="nav-link hover:text-[#CCFF00]">Accueil</a>
                <a href="shop.html" class="nav-link text-[#CCFF00]">Boutique</a>
                <a href="lookbook.html" class="nav-link hover:text-[#CCFF00]">Lookbook</a>
            </div>
            <a href="cart.html"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg></a>
        </div>
    </nav>

    <div class="pt-32 px-6 max-w-7xl mx-auto">
        <div class="flex justify-between items-end mb-12">
            <h1 class="text-6xl font-['Oswald'] italic uppercase">Archives.</h1>
            <div class="flex space-x-4 text-xs tracking-widest uppercase">
                <button class="border-b border-[#CCFF00] pb-1">All</button>
                <button class="text-zinc-500 hover:text-white pb-1">Outerwear</button>
                <button class="text-zinc-500 hover:text-white pb-1">Accessories</button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-12 mb-20">
            <!-- Product Loop -->
            <div class="group">
                <a href="product.html">
                    <div class="aspect-[3/4] bg-zinc-900 mb-4 overflow-hidden relative">
                        <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                        <div class="absolute top-2 left-2 bg-white text-black text-[10px] px-2 py-1 font-bold">SOLD OUT</div>
                    </div>
                    <h3 class="text-sm font-bold uppercase">Oversize Cargo Pants</h3>
                    <p class="text-zinc-500 text-xs">185€</p>
                </a>
            </div>
            <div class="group">
                <a href="product.html">
                    <div class="aspect-[3/4] bg-zinc-900 mb-4 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&q=80" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                    </div>
                    <h3 class="text-sm font-bold uppercase">Leather 'Riot' Jacket</h3>
                    <p class="text-[#CCFF00] text-xs">450€</p>
                </a>
            </div>
            <div class="group">
                <a href="product.html">
                    <div class="aspect-[3/4] bg-zinc-900 mb-4 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&q=80" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                    </div>
                    <h3 class="text-sm font-bold uppercase">Graphic Tee 01</h3>
                    <p class="text-zinc-500 text-xs">65€</p>
                </a>
            </div>
            <div class="group">
                <a href="product.html">
                    <div class="aspect-[3/4] bg-zinc-900 mb-4 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?auto=format&fit=crop&q=80" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                    </div>
                    <h3 class="text-sm font-bold uppercase">Black Logo Beanie</h3>
                    <p class="text-zinc-500 text-xs">45€</p>
                </a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
