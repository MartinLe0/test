<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier | VOID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-white font-['Inter']">
    <nav class="fixed w-full z-50 bg-black border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-['Oswald'] tracking-tighter italic">VOID_</a>
        </div>
    </nav>

    <div class="pt-32 px-6 max-w-3xl mx-auto mb-20">
        <h1 class="text-4xl font-['Oswald'] uppercase italic mb-12">Your Cart (1)</h1>
        
        <div class="space-y-8">
            <div class="flex space-x-6 border-b border-white/10 pb-8">
                <img src="https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&q=80" class="w-32 h-40 object-cover">
                <div class="flex-1">
                    <div class="flex justify-between">
                        <h3 class="font-bold uppercase">Phantom Hoodie</h3>
                        <p>120€</p>
                    </div>
                    <p class="text-zinc-500 text-sm">Size: L</p>
                    <div class="mt-auto flex justify-between items-end pt-8">
                        <button class="text-xs underline text-zinc-500 hover:text-white">Remove</button>
                        <div class="flex items-center space-x-4">
                            <button class="text-lg">-</button>
                            <span>1</span>
                            <button class="text-lg">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-12">
            <div class="flex justify-between font-bold text-xl uppercase mb-8">
                <span>Total</span>
                <span>120.00€</span>
            </div>
            <a href="checkout.html" class="block w-full bg-white text-black text-center font-black py-5 uppercase hover:bg-[#CCFF00] transition-colors">
                Proceed to Checkout
            </a>
            <a href="shop.html" class="block text-center mt-6 text-xs uppercase tracking-widest text-zinc-500">Continue Shopping</a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
