<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID | Underground Streetwear & Drops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-white font-['Inter']">
    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-['Oswald'] tracking-tighter italic">VOID_</a>
            <div class="hidden md:flex space-x-8 uppercase text-xs tracking-widest">
                <a href="index.html" class="nav-link text-[#CCFF00]">Accueil</a>
                <a href="shop.html" class="nav-link hover:text-[#CCFF00] transition">Boutique</a>
                <a href="lookbook.html" class="nav-link hover:text-[#CCFF00] transition">Lookbook</a>
            </div>
            <div class="flex items-center space-x-6">
                <a href="cart.html" class="relative">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-[#CCFF00] text-black text-[10px] font-bold px-1.5 rounded-full">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero / Drop Section -->
    <section class="relative h-screen flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&q=80" class="w-full h-full object-cover opacity-50 grayscale hover:grayscale-0 transition duration-1000">
        </div>
        <div class="relative z-10 text-center">
            <h2 class="text-[#CCFF00] uppercase tracking-[0.3em] text-sm mb-4">Next Drop In</h2>
            <div id="countdown" class="text-6xl md:text-9xl font-['Oswald'] mb-8">00:00:00:00</div>
            <a href="shop.html" class="bg-white text-black px-10 py-4 font-bold uppercase hover:bg-[#CCFF00] transition-colors inline-block">Accéder au Drop</a>
        </div>
    </section>

    <!-- Featured -->
    <section class="py-20 px-6">
        <div class="max-w-7xl mx-auto">
            <h3 class="text-4xl font-['Oswald'] mb-12 uppercase italic">Dernières Sorties</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="group relative">
                    <a href="product.html">
                        <div class="aspect-[3/4] overflow-hidden bg-zinc-900">
                            <img src="https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&q=80" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        </div>
                        <div class="mt-4 flex justify-between items-start">
                            <div>
                                <h4 class="font-bold uppercase">Phantom Hoodie</h4>
                                <p class="text-zinc-500 text-sm">Limited Release</p>
                            </div>
                            <span class="text-[#CCFF00]">120€</span>
                        </div>
                    </a>
                </div>
                <!-- More items could go here -->
            </div>
        </div>
    </section>

    <footer class="border-t border-white/10 py-20 px-6">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-12">
            <div class="col-span-2">
                <h4 class="text-2xl font-['Oswald'] italic mb-6">VOID_</h4>
                <p class="text-zinc-400 max-w-sm">Esthétique brute. Culture underground. Exclusivité absolue. Rejoignez le collectif.</p>
            </div>
            <div>
                <h5 class="font-bold mb-4 uppercase text-xs tracking-widest">Navigation</h5>
                <ul class="space-y-2 text-zinc-400 text-sm">
                    <li><a href="shop.html" class="hover:text-white">Boutique</a></li>
                    <li><a href="lookbook.html" class="hover:text-white">Lookbook</a></li>
                    <li><a href="cart.html" class="hover:text-white">Panier</a></li>
                </ul>
            </div>
            <div>
                <h5 class="font-bold mb-4 uppercase text-xs tracking-widest">Newsletter</h5>
                <div class="flex border-b border-white pb-2">
                    <input type="email" placeholder="EMAIL@VOID.COM" class="bg-transparent w-full focus:outline-none text-xs">
                    <button class="text-[#CCFF00] font-bold text-xs">JOIN</button>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
